# Review only. Do not add deploy, Vercel, or Edge publish here.
# Leaves crm-quality, ops-v5-sql-gate, and deploy-vercel unchanged.
name: Review

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_META_SEND: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
